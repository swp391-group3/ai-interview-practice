name: Backend quality

on:
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/backend-quality.yml'
      - '.docker/compose.local.yaml'
      - '.env.example'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/backend-quality.yml'
      - '.docker/compose.local.yaml'
      - '.env.example'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.1' # Patched Go 1.27 toolchain; keep aligned with api/go.mod.
          cache-dependency-path: api/go.sum
      - name: Formatting, vet, unit tests, lint, and build
        run: make check
      - name: Race detection
        run: make test-race
      - name: Vulnerability scan
        run: make vuln
      - name: Validate local Compose syntax
        run: docker compose --env-file ../.env.example -f ../.docker/compose.local.yaml config --quiet
